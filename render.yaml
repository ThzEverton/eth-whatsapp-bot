services:
  - type: web
    name: eth-whatsapp-bot
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: node online/render.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: AUTH_DIR
        value: ./auth
      - key: CONFIG_FILE
        value: ./runtime/config.json
      - key: BOT_GATEWAY_TOKEN
        sync: false
      - key: OWNER_JID
        sync: false
      - key: ALLOWED_GROUP_IDS
        value: ""
      - key: LOG_LEVEL
        value: info
