<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar demonstração</title><style>body{font:16px system-ui;background:#0d1714;color:#eaf5ef;max-width:820px;margin:40px auto;padding:20px}input,button{padding:12px;border-radius:9px;border:1px solid #506a5a;font:inherit}input{background:#192a22;color:white;width:min(420px,90%)}button{background:#b5e7c6;cursor:pointer}article{border:1px solid #405449;padding:16px;border-radius:12px;margin:12px 0}article button{background:#f5c3bd}small{display:block;color:#b6c7bc;margin:6px 0}#message{margin:18px 0}</style><h1>Gerenciar demonstração</h1><p>Até cinco instalações. Remover uma instalação desconecta o bot e apaga seus dados no servidor.</p><label>Senha administrativa<br><input type="password" id="secret" autocomplete="off" placeholder="Digite a senha administrativa"></label> <button id="refresh">Consultar vagas</button><p id="message"></p><div id="items"></div><script>
const secret=document.querySelector('#secret'),items=document.querySelector('#items'),msg=document.querySelector('#message');
async function api(route,options={}){const response=await fetch('/api/admin/'+route,{...options,headers:{'x-admin-secret':secret.value,'Content-Type':'application/json'}});const data=await response.json();if(!response.ok)throw Error(data.error||'Erro ao consultar');return data}
async function refresh(){try{const data=await api('list');items.replaceChildren();msg.textContent=data.installations.length+' de '+data.max+' vagas ocupadas';for(const record of data.installations){const article=document.createElement('article'),heading=document.createElement('strong'),info=document.createElement('small'),button=document.createElement('button');heading.textContent='Instalação '+record.id.slice(0,8);info.textContent='Criada em '+new Date(record.created).toLocaleString('pt-BR')+' • '+(record.running?'Bot ativo':'Bot parado');button.textContent='Liberar esta vaga';button.onclick=async()=>{if(!confirm('Excluir esta instalação e seus dados? Esta ação não pode ser desfeita.'))return;try{await api('remove',{method:'POST',body:JSON.stringify({id:record.id})});await refresh()}catch(e){msg.textContent=e.message}};article.append(heading,info,button);items.append(article)}}catch(e){msg.textContent=e.message}}
document.querySelector('#refresh').onclick=refresh;
</script></html>
