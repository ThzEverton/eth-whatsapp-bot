<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · ETH / WhatsApp</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6faf8;color:#172b36;font-family:Inter,system-ui,Arial,sans-serif;padding:20px}.card{width:min(400px,100%);background:#fff;padding:32px;border:1px solid #e2eae7;border-radius:18px;box-shadow:0 16px 55px #172b360c}.brand{font-size:22px;font-weight:750}.brand span{color:#087f55}h1{font-size:24px;margin:24px 0 8px}p{color:#64748b;line-height:1.5;font-size:14px}label{display:block;font-size:13px;font-weight:600;margin:25px 0 8px}input{width:100%;padding:13px;border:1px solid #cadbd3;border-radius:9px;font:inherit}button{width:100%;margin-top:18px;background:#087f55;color:white;padding:14px;border:0;border-radius:9px;font-weight:650;cursor:pointer}button:disabled{opacity:.6}#error{color:#bc2934;min-height:22px}input:focus-visible,button:focus-visible{outline:3px solid #8edbbc;outline-offset:2px}</style>
</head><body><main class="card"><div class="brand">ETH<span> / WhatsApp</span></div><h1>Acessar o painel</h1><p>Entre com sua senha de administrador para gerenciar o bot com segurança.</p><form id="login"><label for="password">Senha de acesso</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Entrar no painel</button><p id="error" role="alert"></p></form></main>
<script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;document.getElementById('error').textContent='';try{const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(!res.ok)throw Error('Senha incorreta ou serviço indisponível.');location.assign('/');}catch(err){document.getElementById('error').textContent=err.message;btn.disabled=false;}})</script></body></html>
